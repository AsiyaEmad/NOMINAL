services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NOMINAL_APP_ENV: docker
      NOMINAL_DATABASE_URL: sqlite:////data/nominal.db
      NOMINAL_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - nominal_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  nominal_data:
